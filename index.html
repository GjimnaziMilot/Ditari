<!DOCTYPE html>
<html lang="sq">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        /* Sigurohemi që faqja të zërë gjithë ekranin */
        body, html { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Fshehim scroll-in e jashtëm për t'ia lënë aplikacionit */
        }
        
        /* Iframe do të mbushë gjithë hapësirën e mbetur */
        iframe { 
            flex-grow: 1; 
            border: none; 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <!-- Koka e faqes (Identiteti i Shkollës) -->
    <header class="bg-slate-900 text-white py-4 px-6 shadow-md border-b-4 border-emerald-600 z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-school text-emerald-400"></i> Gjimnazi Milot
                </h1>

            </div>
            
            <!-- Butoni që e hap aplikacionin në një dritare të re (Këshillohet për Printim PDF të pastër) -->
            <div class="flex gap-2">
                <a href="https://lovable.dev/projects/6911e129-c00d-432b-871d-572c2350b2d6?magic_link=mc_75e3ba84-f0dc-47bb-a60c-f15eab5c2526" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-5 py-2.5 rounded-lg flex items-center gap-2 transition shadow">
                    <i class="fa-solid fa-external-link-alt"></i> Hape për Printim
                </a>
            </div>
        </div>
    </header>

    <!-- Këtu integrohet aplikacioni yt i krijuar në Lovable -->
    <!-- iframe lejon që një faqe tjetër web (Lovable) të shfaqet brenda faqes tënde -->
    <iframe 
        src="https://lovable.dev/projects/6911e129-c00d-432b-871d-572c2350b2d6?magic_link=mc_75e3ba84-f0dc-47bb-a60c-f15eab5c2526" 
        allow="clipboard-write"
        title="Gjeneratori i Ditarit Lovable">

</body>
